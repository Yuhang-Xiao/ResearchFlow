name: publication_grade_research_product
version: 1
purpose: >
  Generic workflow1 recipe for turning a data file and research goal into a
  publication-grade research package with Q1-prioritized literature,
  content-complete manuscript writing, model-setting detail, result visualization
  narratives, LaTeX output, Zotero readback, dual-track research corpus outputs,
  proofreading, and repair logs.
default_run_package_dirs:
  - 01_数据与特征
  - 02_文献证据
  - 03_模型实验
  - 04_图表与解释
  - 05_LaTeX论文
  - 06_Zotero写回
  - 07_校稿与审稿
  - 08_质量门与返工日志
  - 09_研究语料与训练样本
required_gates:
  - q1_literature_candidate_count
  - core_literature_count
  - content_completeness_gate
  - method_detail_gate
  - result_visual_narrative_gate
  - top_journal_benchmark_gate
  - citation_density
  - model_pathology_audit
  - latex_pdf
  - latex_overfull
  - proofreading_outputs
  - corpus_safety_gate
  - corpus_reuse_gate
  - corpus_dedup_gate
zotero_policy:
  write_method: MCP/API only
  readback_required: true
  direct_sqlite_editing: forbidden
manuscript_policy:
  fixed_word_count: forbidden
  completeness_basis: content coverage, method reproducibility, visual explanation, citation evidence, and reviewer-risk audit
  methods_requirement: data, preprocessing, features, models, hyperparameters, validation, metrics, explainability, robustness, and failed candidates
corpus_policy:
  tracks:
    - rag_chunks
    - optional_training_jsonl
  forbidden_content:
    - api_keys
    - secrets
    - unlicensed_full_text
    - raw_sensitive_records
  required_metadata:
    - source_run
    - domain
    - task_type
    - evidence
    - hash
    - reusable_status
external_reference_policy:
  github_huggingface_docs: engineering_only
  peer_reviewed_literature: required_for_scientific_claims
  metadata_only: cannot_support_strong_claims
