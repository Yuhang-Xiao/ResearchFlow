name: rl_comparison_protocol
version: 1
created_at: "2026-04-26 19:12:22"
description: "RL/DQN must compare heuristic, Q-learning, random, historical, risk-ranking under same constraints and budget"
required_fields:
  - model_name
  - model_role
  - split_id
  - primary_metric
  - secondary_metrics
  - uncertainty
  - runtime
  - parameter_count
  - interpretability
  - constraints
  - paper_usable
quality_gates:
  - at_least_one_simple_baseline
  - same_data_split_budget_constraints_metrics
  - advanced_model_compared_to_interpretable_control
  - formal_claims_require_user_confirmation
