[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "workflow1"
version = "0.1.0"
description = "ResearchFlow OS, a Codex-assisted scientific workflow framework."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "scikit-learn",
    "matplotlib",
    "PyYAML",
    "python-docx",
    "pypdf",
]

[project.scripts]
workflow1 = "workflow1.cli:main"
researchflow = "workflow1.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
