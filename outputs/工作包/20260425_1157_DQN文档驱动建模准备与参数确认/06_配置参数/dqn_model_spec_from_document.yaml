  evidence: "鉴于AFB₁被国际癌症研究机构（IARC）归类为1类致癌物，具有明确的遗传毒性与致癌性，本研究采用暴露边际（Margin of Exposure, MOE）法进行风险特征描述(Wu, 2015)。MOE是由FAO/WHO食品添加剂联合专家委员会（JECFA）和EFSA推荐的用于评估遗传毒性致癌物风险的首选方法，其优势在于能够避免制定单一的安全阈值，而是通过比率量化暴露水平与毒理学效应点之间的距离(Benford et al., 2010; EFSA Journal, 2005; FAO/WHO, 2006)。但从现有风险导向检查/监测方法的综述性证据来看，相关研究更多讨论如何利用历史记录、企业特征与合规行为等进行风险检查设计(Van Asselt et al., 2021)，而较少将MOE这类毒理学风险表征与抽检整数决策、预算硬约束以及信念更新机制在同一动态优化框架中联结起来。因此，本研究以MOE驱动的暴露风险最小化为目标，在预算与产能硬约束下，将抽检建模为包含信息获取与风险干预的动态决策过程，并把MOE风险、抽检与处置成本、以及信念不确定性下降的信息价值整合到动态抽检策略中。\n本研究为食品安全监管资源配置提供了科学的方法支撑与决策工具。该框架输出的是一套可执行的动态抽检规则：即在既定预算与产能约束下，系统地权衡暴露风险降低、抽检与处置成本、以及新增抽检带来的不确定性收敛收益。这一机制使得监管资源配置能够从传统的经验调整转向基于数据的可复现实证与情景评估，从而提升监管决策的科学性与有效性。\n此外，产品召回机制构成了“下游发现—上游担责”的关键闭环。召回事件不仅是对特定质量问题的纠偏，更能通过责任追溯与供应链关系重构影响供给网络的长期行为。Zou等（2023）的研究强调了召回后果对供应端创新行为的溢出效应，指出质量风险在主体间具有传导性与长期联动性。这一逻辑支持将召回损失显式纳入监管目标函数：抽检策略与召回机制并非独立的治理模块，二者通过对上游激励的共同作用，构成了治理体系中的动态反馈回路(Zou et al., 2023)。相关研究表明，召回决策的及时性与主动性受高管特征、供应链结构及外部监管压力的共同调节，且逆向召回带来的成本分担机制能有效倒逼上游供应商提升质量(Astvansh et al., 2022; Wowak et al., 2021)。\n食品安全抽检（监测）资源分配的核心难点在于：在预算受限条件下，决策者需要同时在采样位置、抽样策略、样本量与检测频次等多个维度上进行联合决策，并将监测表现明确映射到公共健康保护或风险降低目标上。现有研究通常将该问题形式化为预算约束下的优化设计，主要分为两类路径。一类研究侧重于“在给定预算下最大化监测绩效”，利用数学规划方法在供应链的多个控制点与多种危害之间分配检测资源。例如，Wang et al.(2020)在乳制品供应链多化学物质监测情景下，将各环节的样本收集与检测数量设为决策变量，采用混合整数非线性规划（MINLP）来最大化监测对健康风险（以伤残调整寿命年DALYs表征）的降低效果。另一类研究则强调不确定性与实施规则（如分层抽样、合并样策略）的组合复杂性，常将蒙特卡洛仿真与优化算法相结合，比较不同采样策略的成本效果，并输出不同预算水平下的最优方案(Focker et al., 2019; Powell, 2014)。此外，随着预测技术的发展，面向“高风险批次”识别的机器学习模型也被纳入监测流程，形成了“预测—抽检—成本”串联的决策框架(X. Wang et al., 2022)。相关研究进一步将风险监测流程结构化为“风险排序—抽样对象选择—抽样策略/样本量确定”三个步骤，这为将先进的优化算法嵌入抽检流程提供了逻辑思路(Focker et al., 2023)。\n针对食品抽检监管的特殊性，应用DRL的核心难点在于将“策略可行性”与“风险敏感性”内生于求解过程。一方面，预算上限与检测产能构成了每期决策的硬约束，要求算法在探索与利用过程中必须严格遵守动作空间的可行边界；另一方面，食品安全风险（如召回或爆发事件）通常具有显著的尾部特征，这意味着目标函数不能仅关注期望收益，还需对高风险状态下的极端损失保持高度敏感。因此，本研究采用受限部分可观测马尔可夫决策过程的DRL框架，通过提取可观测特征来表征风险信念与不确定性，并在动作选择阶段显式构建满足约束的可行域。这一设计旨在将模型的优化能力转化为满足监管制度约束、且具备抗尾部风险能力的动态抽检规则。\n设全国共有个省份，时间以月推进。政府在每期对每省两环节分别配置整数抽检批次与，并在预算与产能（制度上限）约束下，最小化以暴露风险（MOE表征）为核心的社会损失，同时将抽检成本、处置/召回损失与信息价值纳入同一目标函数框架，从而实现从抽检观测到信息更新、再到风险干预这一完整闭环的动态优化。\n真实污染率的跨期演化满足马尔可夫结构，并同时受供给侧质量努力与流通端筛检/拦截强度影响。设供应端努力与流通端筛检强度为环境实体决策且对监管压力响应，外生扰动包括季节、气候、价格等冲击。为保持以抽检资源分配为主要优化目的，要求响应函数满足单调性与边际递减：监管越强、预期惩罚/召回成本越高，越促使上游努力与下游拦截增强，从而降低下一期不合规概率；同时努力存在成本，提升幅度递减。\n其中为人均日消费量，为平均体重，为毒理学基准剂量下限（单位与一致）。将通过阈值映射为惩罚，并按人口权重汇总进入目标函数，使抽检策略直接最小化暴露风险而非仅优化检出率(Benford et al., 2010; EFSA Scientific Committee, 2005)。\n目标函数与约束\n(3)单期损失/奖励函数（风险+成本+处置/召回+信息价值）\n以MOE驱动的风险惩罚为核心，令为将映射为风险强度的函数（例如阈值缺口或），其中为参考阈值。由前节暴露评估从与等参数计算得到，记为。\n处置/召回损失用其在信念下的期望表示：\n信息价值用“信念方差缩减”刻画。对每个，令\n据此，给出单期损失函数（最小化形式）：\n等价地，若用奖励最大化，可令\n令为政策（在实现中由DQN近似），其将信念状态映射为可行动作：。目标为最小化期望折扣累计损失：\n本研究以2015 - 2024年全国花生抽检通报的逐条记录为基础，优先构建“计数面板”作为后续受限POMDP的信念更新与动态决策的核心数据结构。具体做法是将通报文本中的时间、地区与抽检发生地信息进行规范化与归一化处理（合并同名异写、统一省级口径），并以“省份—月份（或年份）—环节”为基本索引单元，对每期抽检批次进行汇总，得到当期抽检总批次数与当期检出/不合格批次数，其中表示省份、表示环节、表示时间。该计数面板同时保留与抽检强度相关的制度与资源信息（如当期预算或抽检批次上限），从而保证在每个时间步上均可形成“动作（抽检批次）—观测（检出计数）—信念更新”的输入。计数面板数据构成了模型在时空维度上进行推断的核心统计基础。它不仅记录了当期的监管投入与检出情况，也是驱动Beta-Binomial贝叶斯更新、动态解析不确定性演化以及量化信息价值（方差缩减）的数据基础，因此被确立为本研究的主数据来源。\n在此基础上，进一步构建“清洗表”作为暴露评估与风险度量（MOE/EDI）的辅助信息与先验/派生特征来源，但不替代计数面板在信念更新中的核心地位。清洗表主要围绕污染物浓度与暴露指标进行结构化：对通报中被识别为黄曲霉毒素B1（AFB1）的阳性批次提取其浓度数值，完成单位一致化、异常值检查与统计汇总后，在省份—时间尺度上估计污染发生条件下浓度分布参数（如对数正态的），并据此计算浓度的均值/分位数等稳健统计量；随后将其与消费量、人口规模与体重等参数匹配，形成、及等风险派生量，用于将污染浓度、膳食摄入水平与毒理学效应点在同一度量体系下衔接起来，从而把监管目标转化为可计算、可解释的风险控制指标。需要强调的是，清洗表在数据结构上不包含每期抽检批次与检出计数等“观测生成机制”的信息，无法独立支撑belief更新与在线信息价值计算，因此在模型中被定位为：为暴露评估提供稳定的浓度机制参数、为风险惩罚项提供可计算输入，并在监测数据时序缺失的情形下，通过平滑补全机制保障状态特征的连续性，从而为评估体系提供稳健且一致的数据结构支持。\n在求解层面，DQN并不直接在真实污染隐状态上决策，而是在“信念—特征”空间上学习政府的抽检策略。令表示省份、环节在"
