problem_framing:
  document_summary: "研究计划将花生/AFB1 风险监管表述为受限 POMDP / belief-MDP / 深度强化学习问题；抽检既是风险干预动作，也是更新信念的信息获取机制。"
  evidence: "食品抽检不仅是对当期产品质量的检验，更是一种在不完全信息下配置有限监管资源的动态决策。当供给侧合规努力与真实污染水平难以被直接观察时，抽检提供了更新风险判断所需的信息，同时抽检的不确定性会影响供应商和采购方的行为，进而对食品安全产生影响(Starbird, 2005)，基于美国监管数据的研究发现，现场检查的结果能够对后续质量事件（如召回）给出有信息含量的预测，从而得出“检查—信息—未来风险”之间存在可建模的动态联系(Ball et al., 2017)。这类情境与部分可观测序贯决策相匹配：决策者无法直接观测系统状态，只能依据观测信号更新对状态的信念并据此选择行动(Monahan, 1982; Smallwood & Sondik, 1973; J. Wang et al., 2025)。同时，监管实践还必须满足预算与产能等硬约束，并在不同地区/对象之间做优先级排序与权衡(Van Asselt et al., 2021)，这与受约束MDP对“在约束条件下优化目标”的解释相一致(Altman, 2021)。\n鉴于AFB₁被国际癌症研究机构（IARC）归类为1类致癌物，具有明确的遗传毒性与致癌性，本研究采用暴露边际（Margin of Exposure, MOE）法进行风险特征描述(Wu, 2015)。MOE是由FAO/WHO食品添加剂联合专家委员会（JECFA）和EFSA推荐的用于评估遗传毒性致癌物风险的首选方法，其优势在于能够避免制定单一的安全阈值，而是通过比率量化暴露水平与毒理学效应点之间的距离(Benford et al., 2010; EFSA Journal, 2005; FAO/WHO, 2006)。但从现有风险导向检查/监测方法的综述性证据来看，相关研究更多讨论如何利用历史记录、企业特征与合规行为等进行风险检查设计(Van Asselt et al., 2021)，而较少将MOE这类毒理学风险表征与抽检整数决策、预算硬约束以及信念更新机制在同一动态优化框架中联结起来。因此，本研究以MOE驱动的暴露风险最小化为目标，在预算与产能硬约束下，将抽检建模为包含信息获取与风险干预的动态决策过程，并把MOE风险、抽检与处置成本、以及信念不确定性下降的信息价值整合到动态抽检策略中。\n本研究在理论建模与风险表征上实现了对传统监管优化问题的深化。针对真实污染水平对监管者而言不可直接观测的特性，本研究将抽检视为既提供观测信息以更新风险判断，又触发处置行动的复合过程，从而在“信念状态”上将该问题刻画为部分可观测的马尔科夫决策过程(Monahan, 1982)；同时，在优化决策处理上要求抽检批次的整数性与硬预算约束，从而把资源配置的可行性条件内生化到决策逻辑之中(Altman, 2021)。在风险刻画上，本研究将暴露评估与毒理学基准通过MOE/EDI进行对接，使监管目标从"
