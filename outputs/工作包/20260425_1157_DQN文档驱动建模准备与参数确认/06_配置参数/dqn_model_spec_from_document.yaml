  evidence: "食品抽检不仅是对当期产品质量的检验，更是一种在不完全信息下配置有限监管资源的动态决策。当供给侧合规努力与真实污染水平难以被直接观察时，抽检提供了更新风险判断所需的信息，同时抽检的不确定性会影响供应商和采购方的行为，进而对食品安全产生影响(Starbird, 2005)，基于美国监管数据的研究发现，现场检查的结果能够对后续质量事件（如召回）给出有信息含量的预测，从而得出“检查—信息—未来风险”之间存在可建模的动态联系(Ball et al., 2017)。这类情境与部分可观测序贯决策相匹配：决策者无法直接观测系统状态，只能依据观测信号更新对状态的信念并据此选择行动(Monahan, 1982; Smallwood & Sondik, 1973; J. Wang et al., 2025)。同时，监管实践还必须满足预算与产能等硬约束，并在不同地区/对象之间做优先级排序与权衡(Van Asselt et al., 2021)，这与受约束MDP对“在约束条件下优化目标”的解释相一致(Altman, 2021)。\n鉴于AFB₁被国际癌症研究机构（IARC）归类为1类致癌物，具有明确的遗传毒性与致癌性，本研究采用暴露边际（Margin of Exposure, MOE）法进行风险特征描述(Wu, 2015)。MOE是由FAO/WHO食品添加剂联合专家委员会（JECFA）和EFSA推荐的用于评估遗传毒性致癌物风险的首选方法，其优势在于能够避免制定单一的安全阈值，而是通过比率量化暴露水平与毒理学效应点之间的距离(Benford et al., 2010; EFSA Journal, 2005; FAO/WHO, 2006)。但从现有风险导向检查/监测方法的综述性证据来看，相关研究更多讨论如何利用历史记录、企业特征与合规行为等进行风险检查设计(Van Asselt et al., 2021)，而较少将MOE这类毒理学风险表征与抽检整数决策、预算硬约束以及信念更新机制在同一动态优化框架中联结起来。因此，本研究以MOE驱动的暴露风险最小化为目标，在预算与产能硬约束下，将抽检建模为包含信息获取与风险干预的动态决策过程，并把MOE风险、抽检与处置成本、以及信念不确定性下降的信息价值整合到动态抽检策略中。\n本研究在理论建模与风险表征上实现了对传统监管优化问题的深化。针对真实污染水平对监管者而言不可直接观测的特性，本研究将抽检视为既提供观测信息以更新风险判断，又触发处置行动的复合过程，从而在“信念状态”上将该问题刻画为部分可观测的马尔科夫决策过程(Monahan, 1982)；同时，在优化决策处理上要求抽检批次的整数性与硬预算约束，从而把资源配置的可行性条件内生化到决策逻辑之中(Altman, 2021)。在风险刻画上，本研究将暴露评估与毒理学基准通过MOE/EDI进行对接，使监管目标从“提高检出”转向“降低暴露风险”，并与遗传毒性致癌物风险管理中常用的优先级讨论形成一致的度量基础(Benford et al., 2010; EFSA Scientific Committee, 2005)。在求解层面，针对省份与时间维度下高维信念状态和离散受限动作带来的计算瓶颈，采用深度Q网络进行近似动态规划，以函数逼近方式学习价值函数并从可观测特征生成抽检配置决策，为大规模受限POMDP在食品监管场景中的可计算化提供方法路径(Mnih et al., 2015)。\n在食品安全监管的真实场景中，监管机构面临的首要结构性难题是信息的非完备性与状态的隐蔽性。由于受监管对象的真实污染水平（隐状态）无法被直接观测，监管者仅能通过抽样检验获取含有随机噪声的有限信号。针对这一特征，Smallwood与Sondik（1973）在有限视域下确立了部分可观测马尔可夫决策过程（POMDP）的最优控制框架。该理论证明，尽管物理状态不可见，但通过维护一个关于系统状态的概率分布（即“信念状态”），可以将原本不可观测的优化问题转化为信念空间上的完全观测问题，且其最优值函数呈现分段线性凸函数（PWLC）的结构特征(Smallwood & Sondik, 1973)。Monahan（1982）进一步从算法实现角度指出，信念状态构成了历史观测与行动的充分统计量。在这一框架下，抽检不再仅仅是判定合格与否的静态动作，而是既作为针对当期风险的直接控制手段，又作为动态的信息获取机制，通过贝叶斯更新修正后验概率以降低系统的认知不确定性(Kaelbling et al., 1998; Monahan, 1982)。因此，构建信念MDP（Belief-MDP）模型，能够为“观测—信念更新—动态决策”这一闭环反馈机制提供严谨的数学描述(Chadès et al., 2008)。\n设全国共有个省份，时间以月推进。政府在每期对每省两环节分别配置整数抽检批次与，并在预算与产能（制度上限）约束下，最小化以暴露风险（MOE表征）为核心的社会损失，同时将抽检成本、处置/召回损失与信息价值纳入同一目标函数框架，从而实现从抽检观测到信息更新、再到风险干预这一完整闭环的动态优化。\n在此不完全信息结构下，监管者对风险的认知以信念分布（belief）而非点估计表述。具体地，对每个采用共轭的Beta–Binomial更新机制：在期初以表示对当期真实污染率的先验信念，当观测到后，后验仍为Beta分布并更新为。由此得到的后验均值与后验方差不仅提供了风险水平的可计算表征，该框架为不确定性的量化提供了统一的数学范式，使得抽检决策能够协同优化降低暴露风险与消解不确定性的双重目标{Citation}(Monahan, 1982; Spaan, 2012; J. Wang et al., 2025)。\n考虑到食品安全风险具有显著的时间变动性（例如季节、仓储条件与气候冲击导致的非平稳），仅做严格累积的贝叶斯更新会使历史观测对当前信念的权重过强，难以及时反映结构变化。因此，在跨期传播时引入遗忘因子，将上期后验的强度按比例衰减后作为下一期先验，使信念既能继承历史信息，又能对近期变化保持敏感。通过上述“隐状态—观测—贝叶斯更新—遗忘传播”构造，原始的部分可观测过程可以转写为在信念空间上的马尔可夫决策过程（belief-MDP），从而为后续在预算与产能硬约束下求解动态抽检策略提供标准的序贯决策过程与可实现的统计更新路径(Altman, 2021; J. Wang et al., 2025)。\n状态转移：供应链响应与外生扰动\n(2)belief-MDP的状态与转移（抽象写法）\n其中由Beta–Binomial共轭更新+遗忘因子传播给出（已在4.2定义）。\n本研究以2015 - 2024年全国花生抽检通报的逐条记录为基础，优先构建“计数面板”作为后续受限POMDP的信念更新与动态决策的核心数据结构。具体做法是将通报文本中的时间、地区与抽检发生地信息进行规范化与归一化处理（合并同名异写、统一省级口径），并以“省份—月份（或年份）—环节”为基本索引单元，对每期抽检批次进行汇总，得到当期抽检总批次数与当期检出/不合格批次数，其中表示省份、表示环节、表示时间。该计数面板同时保留与抽检强度相关的制度与资源信息（如当期预算或抽检批次上限），从而保证在每个时间步上均可形成“动作（抽检批次）—观测（检出计数）—信念更新”的输入。计数面板数据构成了模型在时空维度上进行推断的核心统计基础。它不仅记录了当期的监管投入与检出情况，也是驱动Beta-Binomial贝叶斯更新、动态解析不确定性演化以及量化信息价值（方差缩减）的数据基础，因此被确立为本研究的主数据来源。\n在此基础上，进一步构建“清洗表”作为暴露评估与风险度量（MOE/EDI）的辅助信息与先验/派生特征来源，但不替代计数面板在信念更新中的核心地位。清洗表主要围绕污染物浓度与暴露指标进行结构化：对通报中被识别为黄曲霉毒素B1（AFB1）的阳性批次提取其浓度数值，完成单位一致化、异常值检查与统计汇总后，在省份—时间尺度上估计污染发生条件下浓度分布参数（如对数正态的），并据此计算浓度的均值/分位数等稳健统计量；随后将其与消费量、人口规模与体重等参数匹配，形成、及等风险派生量，用于将污染浓度、膳食摄入水平与毒理学效应点在同一度量体系下衔接起来，从而把监管目标转化为可计算、可解释的风险控制指标。需要强调的是，清洗表在数据结构上不包含每期抽检批次与检出计数等“观测生成机制”的信息，无法独"
