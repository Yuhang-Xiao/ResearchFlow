  evidence: "食品抽检不仅是对当期产品质量的检验，更是一种在不完全信息下配置有限监管资源的动态决策。当供给侧合规努力与真实污染水平难以被直接观察时，抽检提供了更新风险判断所需的信息，同时抽检的不确定性会影响供应商和采购方的行为，进而对食品安全产生影响(Starbird, 2005)，基于美国监管数据的研究发现，现场检查的结果能够对后续质量事件（如召回）给出有信息含量的预测，从而得出“检查—信息—未来风险”之间存在可建模的动态联系(Ball et al., 2017)。这类情境与部分可观测序贯决策相匹配：决策者无法直接观测系统状态，只能依据观测信号更新对状态的信念并据此选择行动(Monahan, 1982; Smallwood & Sondik, 1973; J. Wang et al., 2025)。同时，监管实践还必须满足预算与产能等硬约束，并在不同地区/对象之间做优先级排序与权衡(Van Asselt et al., 2021)，这与受约束MDP对“在约束条件下优化目标”的解释相一致(Altman, 2021)。\n鉴于AFB₁被国际癌症研究机构（IARC）归类为1类致癌物，具有明确的遗传毒性与致癌性，本研究采用暴露边际（Margin of Exposure, MOE）法进行风险特征描述(Wu, 2015)。MOE是由FAO/WHO食品添加剂联合专家委员会（JECFA）和EFSA推荐的用于评估遗传毒性致癌物风险的首选方法，其优势在于能够避免制定单一的安全阈值，而是通过比率量化暴露水平与毒理学效应点之间的距离(Benford et al., 2010; EFSA Journal, 2005; FAO/WHO, 2006)。但从现有风险导向检查/监测方法的综述性证据来看，相关研究更多讨论如何利用历史记录、企业特征与合规行为等进行风险检查设计(Van Asselt et al., 2021)，而较少将MOE这类毒理学风险表征与抽检整数决策、预算硬约束以及信念更新机制在同一动态优化框架中联结起来。因此，本研究以MOE驱动的暴露风险最小化为目标，在预算与产能硬约束下，将抽检建模为包含信息获取与风险干预的动态决策过程，并把MOE风险、抽检与处置成本、以及信念不确定性下降的信息价值整合到动态抽检策略中。\n基于上述现实与理论背景，本研究以花生原料供应链为场景，讨论在预算与抽检产能约束下的动态抽检资源配置问题。\n本研究在理论建模与风险表征上实现了对传统监管优化问题的深化。针对真实污染水平对监管者而言不可直接观测的特性，本研究将抽检视为既提供观测信息以更新风险判断，又触发处置行动的复合过程，从而在“信念状态”上将该问题刻画为部分可观测的马尔科夫决策过程(Monahan, 1982)；同时，在优化决策处理上要求抽检批次的整数性与硬预算约束，从而把资源配置的可行性条件内生化到决策逻辑之中(Altman, 2021)。在风险刻画上，本研究将暴露评估与毒理学基准通过MOE/EDI进行对接，使监管目标从“提高检出”转向“降低暴露风险”，并与遗传毒性致癌物风险管理中常用的优先级讨论形成一致的度量基础(Benford et al., 2010; EFSA Scientific Committee, 2005)。在求解层面，针对省份与时间维度下高维信念状态和离散受限动作带来的计算瓶颈，采用深度Q网络进行近似动态规划，以函数逼近方式学习价值函数并从可观测特征生成抽检配置决策，为大规模受限POMDP在食品监管场景中的可计算化提供方法路径(Mnih et al., 2015)。\n本研究为食品安全监管资源配置提供了科学的方法支撑与决策工具。该框架输出的是一套可执行的动态抽检规则：即在既定预算与产能约束下，系统地权衡暴露风险降低、抽检与处置成本、以及新增抽检带来的不确定性收敛收益。这一机制使得监管资源配置能够从传统的经验调整转向基于数据的可复现实证与情景评估，从而提升监管决策的科学性与有效性。\n在信息不对称的市场环境下，抽样检验不仅是质量验证的手段，更是通过信息获取与激励约束影响供给侧行为的关键机制。Starbird（2005）基于委托—代理框架指出，由于抽样误差的存在，买方无法完全观测供应商的食品安全努力，这使得抽检强度与责任分担等制度安排不再是单纯的外生变量，而是与企业的质量投入水平通过策略互动形成内生关联。当企业将抽检风险与处罚后果纳入决策考量时，监管策略能有效改变其利益权衡，促使企业主动调整行为以降低风险，而非仅仅停留在发现当下的不合格产品(Starbird, 2005)。\n此外，产品召回机制构成了“下游发现—上游担责”的关键闭环。召回事件不仅是对特定质量问题的纠偏，更能通过责任追溯与供应链关系重构影响供给网络的长期行为。Zou等（2023）的研究强调了召回后果对供应端创新行为的溢出效应，指出质量风险在主体间具有传导性与长期联动性。这一逻辑支持将召回损失显式纳入监管目标函数：抽检策略与召回机制并非独立的治理模块，二者通过对上游激励的共同作用，构成了治理体系中的动态反馈回路(Zou et al., 2023)。相关研究表明，召回决策的及时性与主动性受高管特征、供应链结构及外部监管压力的共同调节，且逆向召回带来的成本分担机制能有效倒逼上游供应商提升质量(Astvansh et al., 2022; Wowak et al., 2021)。\n在预算约束与检测能力受限的条件下，“风险导向”已成为食品安全监管资源配置的主流范式。现有的风险导向研究主要依赖企业规模、历史监测记录以及社会经济因素等代理指标来评估违规概率，并据此制定差异化的检查方案(Van Asselt et al., 2021)。\n食品安全抽检（监测）资源分配的核心难点在于：在预算受限条件下，决策者需要同时在采样位置、抽样策略、样本量与检测频次等多个维度上进行联合决策，并将监测表现明确映射到公共健康保护或风险降低目标上。现有研究通常将该问题形式化为预算约束下的优化设计，主要分为两类路径。一类研究侧重于“在给定预算下最大化监测绩效”，利用数学规划方法在供应链的多个控制点与多种危害之间分配检测资源。例如，Wang et al.(2020)在乳制品供应链多化学物质监测情景下，将各环节的样本收集与检测数量设为决策变量，采用混合整数非线性规划（MINLP）来最大化监测对健康风险（以伤残调整寿命年DALYs表征）的降低效果。另一类研究则强调不确定性与实施规则（如分层抽样、合并样策略）的组合复杂性，常将蒙特卡洛仿真与优化算法相结合，比较不同采样策略的成本效果，并输出不同预算水平下的最优方案(Focker et al., 2019; Powell, 2014)。此外，随着预测技术的发展，面向“高风险批次”识别的机器学习模型也被纳入监测流程，形成了“预测—抽检—成本”串联的决策框架(X. Wang et al., 2022)。相关研究进一步将风险监测流程结构化为“风险排序—抽样对象选择—抽样策略/样本量确定”三个步骤，这为将先进的优化算法嵌入抽检流程提供了逻辑思路(Focker et al., 2023)。\n针对食品抽检监管的特殊性，应用DRL的核心难点在于将“策略可行性”与“风险敏感性”内生于求解过程。一方面，预算上限与检测产能构成了每期决策的硬约束，要求算法在探索与利用过程中必须严格遵守动作空间的可行边界；另一方面，食品安全风险（如召回或爆发事件）通常具有显著的尾部特征，这意味着目标函数不能仅关注期望收益，还需对高风险状态下的极端损失保持高度敏感。因此，本研究采用受限部分可观测马尔可夫决策过程的DRL框架，通过提取可观测特征来表征风险信念与不确定性，并在动作选择阶段显式构建满足约束的可行域。这一设计旨在将模型的优化能力转化为满足监管制度约束、且具备抗尾部风险能力的动态抽检规则。\n问题描述：预算约束下的跨省×跨期抽检动态配置\n设全国共有个省份，时间以月推进。政府在每期对每省两环节分别配置整数抽检批次与，并在预算与产能（制度上限）约束下，最小化以暴露风险（MOE表征）为核心的社会损失，同时将抽检成本、处置/召回损失与信息价值纳入同一目标函数框架，从而实现从抽检观测到信息更新、再到风险干预这一完整闭环的动态优化。\n考虑到食品安全风险具有显著的时间变动性（例如季节、仓储条件与气候冲击导致的非平稳），仅做严格累积的贝叶斯更新会使历史观测对当前信念的权重过强，难以及时反映结构变化。因此，在"
