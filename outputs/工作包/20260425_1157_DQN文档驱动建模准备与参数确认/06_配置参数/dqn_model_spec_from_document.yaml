  evidence: "中国花生产业链长期面临黄曲霉毒素B1（AFB1）等霉菌毒素污染风险。现有风险评估研究表明，AFB1具有明确的遗传毒性与肝致癌性，且不同地区之间的膳食暴露水平存在显著差异(Benford et al., 2010; Wu, 2015)。在生产与储运过程中，污染往往与高温高湿、降雨季节等环境条件相关，导致其风险在时间与空间上有较大差异；例如针对长江流域花生的研究指出，当地较高污染率与其气候因素相关(Ding et al., 2015)。在这种高度异质的背景下，随机抽检很可能在多数时期得到较低检出，但这并不等同于风险被充分控制；食品安全标准体系也强调，仅依赖检测并不足以保证食品安全(Codex Alimentarius Commission, 2015; Jin et al., 2021)。同时，风险事件往往在首次被发现时已经扩散到更大范围，因此需要“尽早识别—及时处置”的资源配置(J. Wang et al., 2025)。\n食品抽检不仅是对当期产品质量的检验，更是一种在不完全信息下配置有限监管资源的动态决策。当供给侧合规努力与真实污染水平难以被直接观察时，抽检提供了更新风险判断所需的信息，同时抽检的不确定性会影响供应商和采购方的行为，进而对食品安全产生影响(Starbird, 2005)，基于美国监管数据的研究发现，现场检查的结果能够对后续质量事件（如召回）给出有信息含量的预测，从而得出“检查—信息—未来风险”之间存在可建模的动态联系(Ball et al., 2017)。这类情境与部分可观测序贯决策相匹配：决策者无法直接观测系统状态，只能依据观测信号更新对状态的信念并据此选择行动(Monahan, 1982; Smallwood & Sondik, 1973; J. Wang et al., 2025)。同时，监管实践还必须满足预算与产能等硬约束，并在不同地区/对象之间做优先级排序与权衡(Van Asselt et al., 2021)，这与受约束MDP对“在约束条件下优化目标”的解释相一致(Altman, 2021)。\n本研究在理论建模与风险表征上实现了对传统监管优化问题的深化。针对真实污染水平对监管者而言不可直接观测的特性，本研究将抽检视为既提供观测信息以更新风险判断，又触发处置行动的复合过程，从而在“信念状态”上将该问题刻画为部分可观测的马尔科夫决策过程(Monahan, 1982)；同时，在优化决策处理上要求抽检批次的整数性与硬预算约束，从而把资源配置的可行性条件内生化到决策逻辑之中(Altman, 2021)。在风险刻画上，本研究将暴露评估与毒理学基准通过MOE/EDI进行对接，使监管目标从“提高检出”转向“降低暴露风险”，并与遗传毒性致癌物风险管理中常用的优先级讨论形成一致的度量基础(Benford et al., 2010; EFSA Scientific Committee, 2005)。在求解层面，针对省份与时间维度下高维信念状态和离散受限动作带来的计算瓶颈，采用深度Q网络进行近似动态规划，以函数逼近方式学习价值函数并从可观测特征生成抽检配置决策，为大规模受限POMDP在食品监管场景中的可计算化提供方法路径(Mnih et al., 2015)。\n在信息不对称的市场环境下，抽样检验不仅是质量验证的手段，更是通过信息获取与激励约束影响供给侧行为的关键机制。Starbird（2005）基于委托—代理框架指出，由于抽样误差的存在，买方无法完全观测供应商的食品安全努力，这使得抽检强度与责任分担等制度安排不再是单纯的外生变量，而是与企业的质量投入水平通过策略互动形成内生关联。当企业将抽检风险与处罚后果纳入决策考量时，监管策略能有效改变其利益权衡，促使企业主动调整行为以降低风险，而非仅仅停留在发现当下的不合格产品(Starbird, 2005)。\n在预算约束与检测能力受限的条件下，“风险导向”已成为食品安全监管资源配置的主流范式。现有的风险导向研究主要依赖企业规模、历史监测记录以及社会经济因素等代理指标来评估违规概率，并据此制定差异化的检查方案(Van Asselt et al., 2021)。\n部分可观测决策与受限优化（POMDP/CMDP）\n在食品安全监管的真实场景中，监管机构面临的首要结构性难题是信息的非完备性与状态的隐蔽性。由于受监管对象的真实污染水平（隐状态）无法被直接观测，监管者仅能通过抽样检验获取含有随机噪声的有限信号。针对这一特征，Smallwood与Sondik（1973）在有限视域下确立了部分可观测马尔可夫决策过程（POMDP）的最优控制框架。该理论证明，尽管物理状态不可见，但通过维护一个关于系统状态的概率分布（即“信念状态”），可以将原本不可观测的优化问题转化为信念空间上的完全观测问题，且其最优值函数呈现分段线性凸函数（PWLC）的结构特征(Smallwood & Sondik, 1973)。Monahan（1982）进一步从算法实现角度指出，信念状态构成了历史观测与行动的充分统计量。在这一框架下，抽检不再仅仅是判定合格与否的静态动作，而是既作为针对当期风险的直接控制手段，又作为动态的信息获取机制，通过贝叶斯更新修正后验概率以降低系统的认知不确定性(Kaelbling et al., 1998; Monahan, 1982)。因此，构建信念MDP（Belief-MDP）模型，能够为“观测—信念更新—动态决策”这一闭环反馈机制提供严谨的数学描述(Chadès et al., 2008)。\n食品安全抽检（监测）资源分配的核心难点在于：在预算受限条件下，决策者需要同时在采样位置、抽样策略、样本量与检测频次等多个维度上进行联合决策，并将监测表现明确映射到公共健康保护或风险降低目标上。现有研究通常将该问题形式化为预算约束下的优化设计，主要分为两类路径。一类研究侧重于“在给定预算下最大化监测绩效”，利用数学规划方法在供应链的多个控制点与多种危害之间分配检测资源。例如，Wang et al.("
