  evidence: "本研究在理论建模与风险表征上实现了对传统监管优化问题的深化。针对真实污染水平对监管者而言不可直接观测的特性，本研究将抽检视为既提供观测信息以更新风险判断，又触发处置行动的复合过程，从而在“信念状态”上将该问题刻画为部分可观测的马尔科夫决策过程(Monahan, 1982)；同时，在优化决策处理上要求抽检批次的整数性与硬预算约束，从而把资源配置的可行性条件内生化到决策逻辑之中(Altman, 2021)。在风险刻画上，本研究将暴露评估与毒理学基准通过MOE/EDI进行对接，使监管目标从“提高检出”转向“降低暴露风险”，并与遗传毒性致癌物风险管理中常用的优先级讨论形成一致的度量基础(Benford et al., 2010; EFSA Scientific Committee, 2005)。在求解层面，针对省份与时间维度下高维信念状态和离散受限动作带来的计算瓶颈，采用深度Q网络进行近似动态规划，以函数逼近方式学习价值函数并从可观测特征生成抽检配置决策，为大规模受限POMDP在食品监管场景中的可计算化提供方法路径(Mnih et al., 2015)。\n此外，产品召回机制构成了“下游发现—上游担责”的关键闭环。召回事件不仅是对特定质量问题的纠偏，更能通过责任追溯与供应链关系重构影响供给网络的长期行为。Zou等（2023）的研究强调了召回后果对供应端创新行为的溢出效应，指出质量风险在主体间具有传导性与长期联动性。这一逻辑支持将召回损失显式纳入监管目标函数：抽检策略与召回机制并非独立的治理模块，二者通过对上游激励的共同作用，构成了治理体系中的动态反馈回路(Zou et al., 2023)。相关研究表明，召回决策的及时性与主动性受高管特征、供应链结构及外部监管压力的共同调节，且逆向召回带来的成本分担机制能有效倒逼上游供应商提升质量(Astvansh et al., 2022; Wowak et al., 2021)。\n尽管部分可观测马尔可夫决策过程（Partially Observable Markov Decision Process, POMDP）与受限马尔可夫决策过程（Constrained Markov Decision Process, CMDP）为不确定环境下的监管决策提供了理论框架，但在涉及多地区、跨时段及离散整数动作的高维状态空间中，传统动态规划方法面临严重的维数灾难，导致精确求解在计算上不可行。深度强化学习（Deep Reinforcement Learning, DRL）通过引入深度神经网络作为函数逼近器来拟合价值函数或策略函数，为高维状态空间与离散动作空间下的复杂序贯决策提供了可扩展的求解路径(Chen et al., 2021; Mnih et al., 2015; J. Wang et al., 2025)。\n在供应链与运营管理相关研究中，DRL已被证实是解决复杂动态控制问题的有效工具。Oroojlooyjadid等（2022）在经典的动态供应链博弈环境中验证了深度Q网络（Deep Q-Network, DQN）类算法处理多阶段动态决策的可行性，表明其能够捕捉系统内复杂的非线性动态(Oroojlooyjadid et al., 2022)。然而，将DRL从理论模型推向落地应用仍需克服算法设计与适用性评估的挑战。Boute等（2022）系统论述了DRL在库存控制等序贯问题中的设计范式，强调算法架构必须适配问题的特定结构以保证实践中的稳健性(Boute et al., 2022)。\n令为政策（在实现中由DQN近似），其将信念状态映射为可行动作：。目标为最小化期望折扣累计损失：\n本研究确立了涵盖“受限POMDP建模、Belief-MDP转化与DQN策略求解”的系统化技术路线。具体而言，首先在POMDP层面构建隐状态、观测信号与共轭信念更新的数学结构；继而将部分可观测问题形式化为信念空间上的MDP以实现状态全知化；最终，通过将预算硬约束与整数性限制内嵌于DQN的学习过程与执行逻辑，确保生成的动态抽检策略严格满足现实场景的可部署性要求。\n政府（G）为核心DQN智能体，其状态输入是全网向量化信息（信念参数、风险特征、人口权重与预算等），动作为跨省×两环节整数抽检向量；供应商（S）与加工/流通端（M）不作为训练主体，但其响应决定风险转移：分别以质量努力与筛检强度表征，并被设定为对监管压力、风险信号与经济环境的响应函数，从而确立了从监管抽检投入传导至供应链行为调整、并最终驱动风险状态演化的内生反馈机制(Liu et al., 2025)。\nDQN设置\n在求解层面，DQN并不直接在真实污染隐状态上决策，而是在“信念—特征”空间上学习政府的抽检策略。令表示省份、环节在期的Beta信念参数，则政府在期的可观测状态可写为与一组可计算的派生特征的并集，最终输入网络的向量化状态为。在可复现实验的实现中，至少包含三类信息：其一是不确定性与风险水平本身，即每个的及由此得到的后验均值与后验方差，从而实现对风险期望水平与估计不确定性的表征。其二是暴露风险与毒理学风险表征：对每个省份与期，使用清洗表提供的对数正态浓度参数构造污染发生条件下的期望浓度，并用污染概率信念（可由取值或加权组合得到）形成混合浓度，进而计算与，并将（阈值下的风险惩罚映射）作为直接的风险输入，使状态特征与公共卫生目标在同一尺度上对齐(Benford et al., 2010; EFSA Scientific Committee, 2005)。其三是资源与惯性信息，即当期预算、环节单位成本抽检产能上限，以及历史投入与观测（如或其滚动均值），用于反映制度约束、政策惯性与时间相关性。\n[表格行] 1.信念模块（Belief Module） |  | 不确定性基础：Beta分布的超参数，记录历史累积的合规/不合规信息。 | 贝叶斯后验更新\n政府在每期同时对所有省份的两类环节分配抽检批次，动作写为，并要求。由于直接在连续或超大整数域上学习会导致动作空间不可控，实验实现"
