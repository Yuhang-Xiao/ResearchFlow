name: periodic_workflow_review
version: 2026-05-06
trigger_phrases:
  - 检查当前工作流缺什么
  - periodic workflow review
purpose: Review workflow1 capability gaps after durable tasks.
sources_to_inspect:
  - outputs/_index/
  - project_state/
  - workflow_recipes/
  - skills/
  - .agents/skills/
  - research_quality/
  - model_registry/
outputs:
  - workflow_gap_report.md
  - workflow_quality_improvement_backlog.csv
  - approval_required_external_tools.csv
quality_gates:
  - repeated_friction_recorded
  - missing_gate_or_skill_recorded
  - safe_upgrade_or_backlog_created
