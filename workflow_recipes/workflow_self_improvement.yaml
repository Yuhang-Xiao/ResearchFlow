name: workflow_self_improvement
version: 2026-05-06
trigger_phrases:
  - 优化当前工作流
  - 执行工作流自我升级
  - workflow upgrade
required_inputs:
  - workflow_improvement policies
  - local skills and recipes
  - project_state
sources_to_inspect:
  - skills/
  - .agents/skills/
  - workflow_recipes/
  - model_registry/
  - src/workflow1/
  - project_state/
  - references/
github_search_strategy:
  - read README/SKILL/docs/license only
  - do not clone and run third-party code
  - classify candidates before local adaptation
allowed_actions:
  - add local skills
  - add recipes
  - add lightweight stubs
  - update project_state
  - generate reports
  - dry-run tests
approval_required_actions:
  - install MCP/plugin/dependencies
  - write Zotero/database
  - run external code
  - modify formal parameters
outputs:
  - workflow gap report
  - candidate evaluation matrix
  - upgrade action plan
  - approval queue
  - improvement ledger
quality_gates:
  - no raw data modification
  - no formal model execution
  - no unknown third-party script execution
  - ledger updated
  - approval queue updated
